name: Run Kaggle agent team

on:
  # Roda automaticamente a cada 6 horas.
  schedule:
    - cron: "0 */6 * * *"
  # Permite rodar manualmente pela aba "Actions" do GitHub, sem esperar o horário.
  workflow_dispatch: {}

# Necessário para o job conseguir dar commit/push do state.json atualizado.
permissions:
  contents: write

jobs:
  run-agents:
    runs-on: ubuntu-latest
    # Dataset grande (462k linhas): cada modelo demora ~5-6min pra
    # treinar. Com vários hiperparâmetros em sequência, 30min não
    # bastava e o job era cancelado à força no meio de uma submissão.
    timeout-minutes: 180

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Configurar credenciais da Kaggle
        run: |
          mkdir -p ~/.kaggle
          echo "${{ secrets.KAGGLE_API_TOKEN }}" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

      - name: Rodar o orquestrador
        # Limita cada rodada de treino a ~10min: 25 iterações * até
        # 5-6min cada seria demais. MAX_ITERATIONS menor aqui garante
        # que o step termine dentro do tempo do job, mesmo que não
        # bata a meta — a próxima execução agendada continua do ponto
        # salvo no state.json.
        env:
          KAGGLE_COMPETITION: playground-series-s6e7
          TARGET_COLUMN: health_condition
          TASK: classification
          ID_COLUMN: id
          TARGET_PERCENTILE: "0.20"
          MAX_ITERATIONS: "25"
          STATE_PATH: state.json
        run: python orchestrator.py

      - name: Salvar o estado atualizado no repositório
        # if: always() garante que este step roda mesmo se o anterior
        # falhar, der timeout ou for cancelado — sem isso, todo o
        # progresso feito antes do problema seria perdido.
        if: always()
        run: |
          git config user.name "kaggle-agent-bot"
          git config user.email "actions@users.noreply.github.com"

          # Guarda o state.json gerado nesta execução antes de mexer
          # em qualquer coisa. Se um push manual ou outra execução
          # mudou o repositório enquanto este job rodava, um "git
          # push" simples falharia com "fetch first" — em vez de
          # tentar resolver conflito no arquivo, simplesmente
          # sincronizamos com o remoto mais recente e reaplicamos
          # por cima o resultado desta execução (last-write-wins).
          cp state.json /tmp/state_this_run.json

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state_this_run.json state.json
            git add state.json
            if git diff --cached --quiet; then
              echo "Nada novo para commitar"
              exit 0
            fi
            git commit -m "chore: atualiza state.json [skip ci]"
            if git push origin main; then
              echo "Push bem-sucedido na tentativa $i"
              exit 0
            fi
            echo "Push falhou (tentativa $i), sincronizando e tentando de novo..."
          done
          echo "Falhou após 5 tentativas"
          exit 1
